[alembic]
# path to migration scripts
script_location = migrations

# database url (overridden by alembic -x or env)
sqlalchemy.url = sqlite:///./fdr_sentinel.db

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location
version_locations = %(here)s/migrations/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value or "utc". Uses system timezone by default.
# timezone = utc

# max length of characters to apply to the
# "version" field
# max_version_len = 255

# version location
# version_locations = %(here)s/versions

# the string output version will be prepended with 'version:' when running
# an init script
# output_version = version

# SQLAlchemy warning filter
# filter_warnings =

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# autogenerate / compare process
# sourceless = false

# version path separator
# version_path_separator = os.pathsep

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.warn_20 = true


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See documentation for further
# details and examples

# format using "black" - use the console
# script = black console
# for each type of hook, the entry point can be different
# For example, these all invoke the black console script:
# hooks = black console:main
# hooks = black:main
# other variables can be defined here
# for use by the post write hook script
# black_output_flags = --line-length 79

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S